const frame=document.getElementById('appFrame');const siteBtn=document.getElementById('siteBtn');const adminBtn=document.getElementById('adminBtn');
function decode(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
const pages={site:decode(PUBLIC_B64),admin:decode(ADMIN_B64)};
function show(mode){frame.srcdoc=pages[mode];siteBtn.classList.toggle('active',mode==='site');adminBtn.classList.toggle('active',mode==='admin');const u=new URL(location.href);u.searchParams.set('view',mode);history.replaceState(null,'',u)}
siteBtn.addEventListener('click',()=>show('site'));adminBtn.addEventListener('click',()=>show('admin'));const start=new URL(location.href).searchParams.get('view')==='admin'?'admin':'site';show(start);
</script>
